<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="border-top:1px solid var(--tx);margin-top:clamp(72px,10vw,128px)">
<div style="max-width:1280px;margin:0 auto;padding:40px clamp(20px,4vw,40px) 48px;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between;align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:14px;max-width:340px">
<div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;overflow:hidden;display:block"><img src="assets/logo.jpeg" alt="" width="28" height="28" style="width:28px;height:28px;transform:scale(1.55);filter:var(--logo-f);mix-blend-mode:var(--logo-b);display:block"></span><span style="font-weight:600">buatinweb<span style="color:var(--tx2)">.site</span></span></div>
<p style="margin:0;font-size:14px;color:var(--tx2)">{{ t.tag }}</p>
</div>
<nav aria-label="Footer" style="display:flex;flex-wrap:wrap;gap:12px 28px;font-size:14px">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="8"><a href="{{ l.href }}">{{ l.label }}</a></sc-for>
</nav>
</div>
<div style="max-width:1280px;margin:0 auto;padding:16px clamp(20px,4vw,40px) 32px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font:400 12px 'Geist Mono',monospace;color:var(--tx2);border-top:1px solid var(--bd)">
<span>© 2026 Buatinweb.site</span><span>{{ t.prices }}</span>
</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;260px&quot;}}">
const FT={en:{tag:'Websites, applications, technical support, data and AI for clients in Indonesia and abroad.',prices:'Prices in IDR · price book 2026-10-27.v1',l:['Home','Services','Pricing','Estimator','Portfolio','About','FAQ','Contact','Privacy','Terms']},
id:{tag:'Website, aplikasi, technical support, data dan AI untuk klien Indonesia maupun internasional.',prices:'Harga dalam rupiah · daftar harga 2026-10-27.v1',l:['Beranda','Layanan','Harga','Estimator','Portfolio','Tentang','FAQ','Kontak','Privasi','Ketentuan']}};
const P=['Home','Service','Pricing','Estimator','Portfolio','About','FAQ','Contact','About','About'];
class Component extends DCLogic {
  state={L:'en'};
  componentDidMount(){try{this.setState({L:localStorage.getItem('bw-locale')||'en'});}catch(e){}
    this.onP=e=>{if(e.detail.locale)this.setState({L:e.detail.locale});};window.addEventListener('bw-prefs',this.onP);}
  componentWillUnmount(){window.removeEventListener('bw-prefs',this.onP);}
  renderVals(){const t=FT[this.state.L]||FT.en;
    return {t,links:t.l.map((label,i)=>({label,href:encodeURI('Buatinweb '+P[i]+'.dc.html')+(i>7?'#'+(i===8?'privacy':'terms'):'')}))};}
}
</script>
</body>
</html>
